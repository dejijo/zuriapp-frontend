services:
  backend:
    build:
      context: ../zuriapp-backend
    image: zuri-market-backend:dev
    environment:
      PORT: "5000"
      STORE_NAME: "Zuri Market"
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in your .env file}
    ports:
      - "5001:5000"
    restart: unless-stopped
    networks:
      - zuri-network

  frontend:
    build:
      context: ../zuriapp-frontend
    image: zuri-market-frontend:dev
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zuri-network

networks:
  zuri-network:
    driver: bridge
